<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Review</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,sans-serif;
         background:#0f1115; color:#e6e8eb; display:flex; height:100vh; }
  #side { flex:0 0 250px; border-right:1px solid #23272f; padding:14px;
          overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  #side h1 { font-size:16px; margin:0 0 4px; }
  .sess { padding:9px 11px; background:#171a21; border:1px solid #23272f;
          border-radius:8px; cursor:pointer; font-size:13px; }
  .sess:hover { border-color:#3a4150; }
  .sess.active { border-color:#4a8af4; }
  .sess .meta { color:#7f8794; font-size:12px; }
  #main { flex:1; display:flex; min-width:0; }
  #left { flex:1 1 65%; display:flex; flex-direction:column; padding:16px; min-width:0; }
  video { width:100%; max-height:70vh; background:#000; border-radius:8px; }
  #bar { position:relative; height:10px; margin:10px 2px 0;
         background:#2a2e37; border-radius:5px; cursor:pointer; }
  #bar .mk { position:absolute; top:-3px; min-width:4px; height:16px;
             background:#ff5a5f; border-radius:2px; cursor:pointer; opacity:.85; }
  #bar .mk:hover { opacity:1; box-shadow:0 0 6px #ff5a5f; }
  #right { flex:1 1 35%; max-width:460px; overflow-y:auto; padding:16px;
           border-left:1px solid #23272f; }
  h2 { margin:0 0 12px; font-size:16px; color:#9aa4b2; }
  .bug { padding:10px 12px; margin-bottom:8px; background:#171a21;
         border:1px solid #23272f; border-radius:8px; cursor:pointer; }
  .bug:hover { border-color:#3a4150; }
  .bug.active { border-color:#ff5a5f; background:#1e1518; }
  .bug .t { color:#ff8a8d; font-variant-numeric:tabular-nums; font-size:13px; }
  .bug .n { font-weight:600; margin:2px 0 6px; }
  .bug dl { margin:6px 0 0; font-size:13px; color:#c2c8d0; }
  .bug dt { color:#7f8794; margin-top:6px; }
  .bug dd { margin:0; }
  button { background:#2a3a55; color:#dbe4f0; border:1px solid #3a4a68;
           border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover:not(:disabled) { background:#33486b; }
  button:disabled { opacity:.5; cursor:default; }
  .push-row { margin-top:8px; display:flex; align-items:center; gap:8px; }
  .jira-key { color:#7bd88f; font-size:13px; }
  .jira-key a { color:#7bd88f; }
  #jira-box { margin-top:auto; padding-top:10px; border-top:1px solid #23272f;
              font-size:12px; color:#7f8794; }
  #jira-box select { width:100%; margin-top:4px; background:#171a21; color:#e6e8eb;
                     border:1px solid #23272f; border-radius:6px; padding:5px; }
  .empty { color:#7f8794; margin:auto; text-align:center; }
  .err { color:#ff8a8d; font-size:13px; white-space:pre-wrap; }
  .badge { font-size:11px; padding:1px 7px; border-radius:9px; margin-left:5px; }
  .b-ok { background:#173423; color:#7bd88f; }
  .b-no { background:#332a17; color:#e6c07b; }
  .b-run { background:#172433; color:#7bb8e8; }
</style></head><body>
<div id="side">
  <h1>Sessions</h1>
  <div id="slist"></div>
  <div id="jira-box">
    Jira: <span id="jira-mode"></span>
    <select id="jira-proj"><option value="">(chọn project...)</option></select>
  </div>
</div>
<div id="main"><div class="empty">Chọn 1 session bên trái</div></div>
<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch('/api' + p, opt).then(async r => {
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
});
const fmtT = t => t; // MM:SS đã sẵn định dạng
let current = null, pollTimer = null;

// ---------------- sessions list ----------------
async function loadSessions() {
  const list = await api('/sessions');
  $('#slist').innerHTML = '';
  for (const s of list) {
    const el = document.createElement('div');
    el.className = 'sess' + (s.id === current ? ' active' : '');
    const badge = s.analyzing ? '<span class="badge b-run">đang phân tích…</span>'
      : s.analyzed ? `<span class="badge b-ok">${s.bug_count} bug</span>`
      : '<span class="badge b-no">chưa phân tích</span>';
    const pushed = s.pushed_count ? ` · ${s.pushed_count} đã push` : '';
    el.innerHTML = `<div>${s.id} ${badge}</div>
      <div class="meta">${s.size_mb} MB${pushed}</div>`;
    el.onclick = () => { location.hash = s.id; };
    $('#slist').appendChild(el);
  }
}

// ---------------- jira box ----------------
async function loadJira() {
  const s = await api('/jira/settings');
  $('#jira-mode').textContent = s.mode === 'real'
    ? `${s.project_key} (thật)` : 'MOCK (chưa cấu hình đủ .env)';
  try {
    const projects = await api('/jira/projects');
    const sel = $('#jira-proj');
    sel.innerHTML = '<option value="">(chọn project...)</option>';
    for (const p of projects) {
      const o = document.createElement('option');
      o.value = p.key; o.textContent = `${p.key} — ${p.name}`;
      if (p.key === s.project_key) o.selected = true;
      sel.appendChild(o);
    }
    sel.onchange = async () => {
      if (!sel.value) return;
      await api('/jira/settings', {method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({project_key: sel.value})});
      loadJira();
    };
  } catch (e) { /* chưa có credentials -> giữ mock */ }
}

// ---------------- session view ----------------
function secs(t){ let s=0; for (const p of t.split(':')) s = s*60 + +p; return s; }

async function openSession(id) {
  current = id;
  clearInterval(pollTimer);
  const data = await api('/sessions/' + id);
  loadSessions();
  const main = $('#main');

  if (data.analyzing) {
    main.innerHTML = '<div class="empty">⏳ Đang phân tích bằng Gemini (vài phút)…</div>';
    pollTimer = setInterval(() => openSession(id), 4000);
    return;
  }
  if (!data.bugs) {
    main.innerHTML = `<div class="empty">
      Session chưa được phân tích.<br><br>
      ${data.error ? `<div class="err">Lỗi lần trước: ${data.error}</div><br>` : ''}
      <button id="an">Phân tích bằng Gemini</button></div>`;
    $('#an').onclick = async () => {
      await api(`/sessions/${id}/analyze`, {method:'POST'});
      openSession(id);
    };
    return;
  }

  const vsrc = `/api/sessions/${id}/files/${data.video}`;
  main.innerHTML = `
    <div id="left"><video id="v" controls src="${vsrc}"></video><div id="bar"></div></div>
    <div id="right"><h2>Bugs (${data.bugs.length})</h2><div id="list"></div></div>`;
  const v = $('#v'), bar = $('#bar'), list = $('#list');
  const bugs = data.bugs.map(b => ({...b, _start: secs(b.start_time),
    _end: b.end_time ? secs(b.end_time) : null}));

  const cards = bugs.map((b, i) => {
    const el = document.createElement('div');
    el.className = 'bug';
    const rng = b.start_time + (b.end_time ? ' – ' + b.end_time : '');
    el.innerHTML = `<div class="t">${rng}</div><div class="n">${i+1}. ${b.name}</div>
      <dl><dd>${b.description}</dd>
      <dt>Actual</dt><dd>${b.actual_result}</dd>
      <dt>Expected</dt><dd>${b.expected_result}</dd></dl>
      <div class="push-row"></div>`;
    el.onclick = () => { v.currentTime = b._start; v.play(); };
    renderPush(el.querySelector('.push-row'), id, i, b);
    list.appendChild(el);
    return el;
  });

  v.addEventListener('loadedmetadata', () => {
    for (const b of bugs) {
      const mk = document.createElement('div');
      mk.className = 'mk';
      const end = b._end ?? b._start;
      mk.style.left = (b._start / v.duration * 100) + '%';
      mk.style.width = ((end - b._start) / v.duration * 100) + '%';
      mk.title = b.name;
      mk.onclick = e => { e.stopPropagation(); v.currentTime = b._start; v.play(); };
      bar.appendChild(mk);
    }
  });
  bar.addEventListener('click', e => {
    if (v.duration) v.currentTime = (e.offsetX / bar.clientWidth) * v.duration;
  });
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime;
    bugs.forEach((b, i) => cards[i].classList.toggle('active',
      t >= b._start && t <= (b._end ?? b._start + 5)));
  });
}

function renderPush(row, sid, i, b) {
  if (b.jira_key) {
    row.innerHTML = `<span class="jira-key">✓ ${b.jira_url
      ? `<a href="${b.jira_url}" target="_blank">${b.jira_key}</a>` : b.jira_key}</span>`;
    return;
  }
  const btn = document.createElement('button');
  btn.textContent = 'Push to Jira';
  btn.onclick = async e => {
    e.stopPropagation();
    btn.disabled = true; btn.textContent = 'Đang push…';
    try {
      const res = await api(`/sessions/${sid}/bugs/${i}/push`, {method:'POST'});
      b.jira_key = res.key; b.jira_url = res.url;
      renderPush(row, sid, i, b);
      loadSessions();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Push to Jira';
      alert('Push lỗi: ' + err.message);
    }
  };
  row.appendChild(btn);
}

// ---------------- boot ----------------
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id) openSession(id);
});
loadSessions(); loadJira();
if (location.hash.length > 1) openSession(location.hash.slice(1));
</script></body></html>
